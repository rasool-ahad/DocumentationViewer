<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1536" height="1024" viewBox="0 0 1536 1024">
  <title>DocViewer Login UI</title>
  <desc>Editable split-screen login page concept. Text, controls, panels, and illustration are separate SVG elements and groups.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9ff"/><stop offset="1" stop-color="#eef0ff"/>
    </linearGradient>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#193b9d"/><stop offset=".52" stop-color="#1c2d83"/><stop offset="1" stop-color="#4937e8"/>
    </linearGradient>
    <linearGradient id="leftGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2464ff"/><stop offset="1" stop-color="#654bff"/>
    </linearGradient>
    <linearGradient id="buttonGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1855f5"/><stop offset="1" stop-color="#1747ed"/>
    </linearGradient>
    <linearGradient id="bookGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1757ff"/><stop offset="1" stop-color="#7056f5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/><stop offset="1" stop-color="#cbd2ff" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="glassBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8295ff" stop-opacity=".55"/><stop offset="1" stop-color="#314ee6" stop-opacity=".35"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="leftClip"><path d="M96 68 H768 V942 H96 Q76 942 76 922 V88 Q76 68 96 68Z"/></clipPath>
    <clipPath id="cardClip"><rect x="76" y="68" width="1384" height="874" rx="20"/></clipPath>
  </defs>

  <!-- PAGE BACKGROUND -->
  <g id="Page-Background">
    <rect width="1536" height="1024" fill="url(#pageBg)"/>
  </g>

  <!-- MAIN CARD -->
  <g id="Login-Card" filter="url(#cardShadow)">
    <rect x="76" y="68" width="1384" height="874" rx="20" fill="#ffffff"/>
  </g>

  <!-- LEFT PROMOTIONAL PANEL -->
  <g id="Left-Panel" clip-path="url(#leftClip)">
    <rect x="76" y="68" width="692" height="874" fill="url(#leftPanel)"/>
    <path id="Left-Panel-Glow" d="M76 68 H768 V68 L608 68 C432 176 310 286 230 452 C164 588 121 725 76 770Z" fill="url(#leftGlow)" opacity=".52"/>
    <path id="Bottom-Wave-Back" d="M76 770 C240 814 363 848 507 834 C620 823 700 777 768 726 V942 H76Z" fill="#303bb5" opacity=".72"/>
    <path id="Bottom-Wave-Front" d="M76 824 C213 856 342 902 480 893 C606 885 690 840 768 799 V942 H76Z" fill="#4639e8" opacity=".62"/>
    <path id="Top-Accent" d="M608 68 H768 V942 H744 C720 708 706 490 678 315 C661 209 638 125 608 68Z" fill="#4e4df0" opacity=".13"/>
  </g>

  <!-- LEFT BRAND -->
  <g id="Left-Brand" fill="#ffffff">
    <g id="Brand-Book-Icon" transform="translate(144 122)">
      <path d="M0 4 C0 -1 4 -3 9 -3 H19 C27 -3 33 2 33 10 V36 C28 30 22 28 15 28 H8 C3 28 0 24 0 19Z"/>
      <path d="M45 4 C45 -1 41 -3 36 -3 H34 V36 C39 30 45 28 52 28 H56 C61 28 64 24 64 19 V4 C64 -1 60 -3 55 -3Z" transform="translate(-3 0)"/>
      <path d="M30 7 V39" fill="none" stroke="#dfe7ff" stroke-width="2" opacity=".8"/>
    </g>
    <text id="Brand-Name" x="206" y="150" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">DocViewer</text>
  </g>

  <!-- LEFT COPY -->
  <g id="Promotional-Copy" font-family="Inter, Arial, sans-serif">
    <text id="Headline-Line-1" x="145" y="294" fill="#ffffff" font-size="46" font-weight="700">Your Documentation,</text>
    <text id="Headline-Line-2" x="145" y="352" fill="#aebcff" font-size="46" font-weight="700">Organized &amp; Accessible</text>
    <text id="Description-Line-1" x="145" y="402" fill="#f1f4ff" font-size="20" font-weight="400">Create, manage and share beautiful documentation</text>
    <text id="Description-Line-2" x="145" y="432" fill="#f1f4ff" font-size="20" font-weight="400">with a modern and intuitive experience.</text>
  </g>

  <!-- DOCUMENT ILLUSTRATION: BACK WINDOW -->
  <g id="Illustration-Back-Window" filter="url(#softShadow)">
    <rect x="180" y="553" width="476" height="199" rx="13" fill="url(#glassBlue)" stroke="#a8b6ff" stroke-opacity=".24"/>
    <path d="M180 566 Q180 553 193 553 H643 Q656 553 656 566 V579 H180Z" fill="#7f91f8" opacity=".35"/>
    <circle cx="199" cy="566" r="4.5" fill="#b6c2ff" opacity=".55"/>
    <circle cx="217" cy="566" r="4.5" fill="#b6c2ff" opacity=".45"/>
    <circle cx="235" cy="566" r="4.5" fill="#b6c2ff" opacity=".35"/>
    <rect x="198" y="601" width="116" height="11" rx="5.5" fill="#6578e6" opacity=".42"/>
    <rect x="198" y="632" width="94" height="13" rx="6.5" fill="#6578e6" opacity=".38"/>
    <rect x="198" y="664" width="103" height="13" rx="6.5" fill="#6578e6" opacity=".32"/>
    <rect x="198" y="696" width="80" height="13" rx="6.5" fill="#6578e6" opacity=".3"/>
  </g>

  <!-- DOCUMENT ILLUSTRATION: MAIN WINDOW -->
  <g id="Illustration-Main-Window" filter="url(#softShadow)">
    <rect x="234" y="511" width="401" height="286" rx="13" fill="url(#glass)" stroke="#e0e5ff" stroke-opacity=".7"/>
    <path d="M234 524 Q234 511 247 511 H622 Q635 511 635 524 V544 H234Z" fill="#aab7ff" opacity=".65"/>
    <circle cx="252" cy="527" r="4.5" fill="#dbe1ff" opacity=".7"/>
    <circle cx="270" cy="527" r="4.5" fill="#dbe1ff" opacity=".6"/>
    <circle cx="288" cy="527" r="4.5" fill="#dbe1ff" opacity=".5"/>
    <path d="M234 544 H338 V797 H247 Q234 797 234 784Z" fill="#a7b3ff" opacity=".72"/>
    <rect x="251" y="568" width="62" height="10" rx="5" fill="#7284e9" opacity=".42"/>
    <rect x="244" y="592" width="84" height="27" rx="7" fill="#3264f7"/>
    <rect x="255" y="601" width="51" height="8" rx="4" fill="#e8edff"/>
    <rect x="251" y="638" width="59" height="10" rx="5" fill="#687de5" opacity=".42"/>
    <rect x="251" y="665" width="51" height="10" rx="5" fill="#687de5" opacity=".38"/>
    <rect x="251" y="692" width="52" height="10" rx="5" fill="#687de5" opacity=".35"/>
    <rect x="374" y="571" width="175" height="11" rx="5.5" fill="#b3bcf7" opacity=".58"/>
    <rect x="384" y="602" width="178" height="91" rx="8" fill="#aab7f7" opacity=".42"/>
    <circle cx="424" cy="628" r="8" fill="#8798ec" opacity=".35"/>
    <path d="M397 682 L444 635 Q451 628 458 636 L514 693 H397Z" fill="#8295ed" opacity=".4"/>
    <rect x="374" y="715" width="215" height="11" rx="5.5" fill="#8d9beb" opacity=".52"/>
    <rect x="374" y="743" width="177" height="11" rx="5.5" fill="#8d9beb" opacity=".42"/>
  </g>

  <!-- FLOATING BOOK TILE -->
  <g id="Illustration-Book-Tile" filter="url(#softShadow)">
    <rect x="606" y="470" width="95" height="88" rx="17" fill="#2945b9" fill-opacity=".78" stroke="#8195ff" stroke-opacity=".35"/>
    <g transform="translate(630 496)" fill="#ffffff">
      <path d="M0 2 C0 -2 4 -4 8 -4 H17 C24 -4 29 1 29 8 V32 C24 27 19 25 12 25 H7 C3 25 0 22 0 18Z"/>
      <path d="M39 2 C39 -2 35 -4 31 -4 H30 V32 C35 27 40 25 47 25 H51 C55 25 58 22 58 18 V2 C58 -2 54 -4 50 -4Z"/>
      <path d="M29 3 V35" fill="none" stroke="#dbe4ff" stroke-width="2"/>
    </g>
  </g>

  <!-- FLOATING CODE TILE -->
  <g id="Illustration-Code-Tile" filter="url(#softShadow)">
    <rect x="141" y="677" width="88" height="79" rx="16" fill="#354fc0" fill-opacity=".72" stroke="#8395ff" stroke-opacity=".36"/>
    <path d="M174 704 L162 716 L174 728 M195 704 L207 716 L195 728 M188 699 L180 733" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- SPARKLES -->
  <g id="Illustration-Sparkles" fill="#a8a2ff">
    <path d="M594 586 C598 599 602 603 615 607 C602 611 598 615 594 628 C590 615 586 611 573 607 C586 603 590 599 594 586Z" opacity=".85"/>
    <path d="M692 618 C695 629 699 633 710 636 C699 639 695 643 692 654 C689 643 685 639 674 636 C685 633 689 629 692 618Z" opacity=".75"/>
  </g>

  <!-- RIGHT PANEL -->
  <g id="Right-Panel">
    <rect x="768" y="68" width="692" height="874" fill="#ffffff"/>
  </g>

  <!-- THEME SWITCHER -->
  <g id="Theme-Switcher" filter="url(#softShadow)">
    <rect x="1317" y="100" width="110" height="47" rx="24" fill="#f6f7fc" stroke="#e4e8f2"/>
    <circle cx="1347" cy="123.5" r="21" fill="#ffffff"/>
    <g id="Light-Icon" transform="translate(1347 123.5)" fill="#46516b">
      <circle r="6"/>
      <g stroke="#46516b" stroke-width="2.4" stroke-linecap="round">
        <path d="M0 -12 V-9 M0 9 V12 M-12 0 H-9 M9 0 H12 M-8.5 -8.5 L-6.5 -6.5 M6.5 6.5 L8.5 8.5 M8.5 -8.5 L6.5 -6.5 M-6.5 6.5 L-8.5 8.5"/>
      </g>
    </g>
    <path id="Dark-Icon" d="M1398 113 A11 11 0 1 0 1408 131 A9 9 0 0 1 1398 113Z" fill="#46516b"/>
  </g>

  <!-- RIGHT BRAND ICON -->
  <g id="Login-Brand-Icon" transform="translate(1098 177)" fill="url(#bookGradient)">
    <path d="M0 0 C0 -8 7 -13 16 -13 H24 C37 -13 47 -4 47 10 V65 C38 54 28 50 15 50 H10 C4 50 0 45 0 38Z"/>
    <path d="M77 0 C77 -8 70 -13 61 -13 H53 C40 -13 30 -4 30 10 V65 C39 54 49 50 62 50 H67 C73 50 77 45 77 38Z"/>
    <path d="M38.5 0 V69" fill="none" stroke="#e6eaff" stroke-width="2" opacity=".8"/>
  </g>

  <!-- LOGIN HEADING -->
  <g id="Login-Heading" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text id="Welcome-Title" x="1138" y="303" font-size="38" font-weight="700" fill="#101321">Welcome Back!</text>
    <text id="Welcome-Subtitle" x="1138" y="347" font-size="21" fill="#3d4965">Sign in to your account to continue</text>
  </g>

  <!-- EMAIL FIELD -->
  <g id="Email-Field" font-family="Inter, Arial, sans-serif">
    <text id="Email-Label" x="875" y="406" font-size="18" font-weight="600" fill="#101321">Email Address</text>
    <rect id="Email-Input-Background" x="875" y="437" width="522" height="57" rx="13" fill="#ffffff" stroke="#dce2ee" stroke-width="1.5"/>
    <g id="Email-Icon" transform="translate(897 456)" fill="none" stroke="#45516d" stroke-width="2.3" stroke-linejoin="round">
      <rect x="0" y="0" width="19" height="15" rx="2"/>
      <path d="M1 2 L9.5 9 L18 2"/>
    </g>
    <text id="Email-Placeholder" x="936" y="473" font-size="18" fill="#7c88a4">you@example.com</text>
  </g>

  <!-- PASSWORD FIELD -->
  <g id="Password-Field" font-family="Inter, Arial, sans-serif">
    <text id="Password-Label" x="875" y="543" font-size="18" font-weight="600" fill="#101321">Password</text>
    <rect id="Password-Input-Background" x="875" y="557" width="522" height="57" rx="13" fill="#ffffff" stroke="#dce2ee" stroke-width="1.5"/>
    <g id="Password-Lock-Icon" transform="translate(897 575)" fill="none" stroke="#45516d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="9" width="17" height="16" rx="2.5"/>
      <path d="M5 9 V6 A4.5 4.5 0 0 1 14 6 V9"/>
      <path d="M9.5 15 V19"/>
    </g>
    <text id="Password-Placeholder" x="936" y="593" font-size="18" fill="#7c88a4">Enter your password</text>
    <g id="Password-Visibility-Icon" transform="translate(1367 585)" fill="none" stroke="#45516d" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9 0 Q0 -11 9 0 Q0 11 -9 0Z"/>
      <circle cx="0" cy="0" r="3"/>
      <path d="M-11 -10 L11 10"/>
    </g>
  </g>

  <!-- REMEMBER ME -->
  <g id="Remember-Me" font-family="Inter, Arial, sans-serif">
    <rect id="Remember-Checkbox" x="875" y="638" width="22" height="22" rx="5" fill="#1855f5"/>
    <path id="Remember-Checkmark" d="M880 649 L885 654 L893 644" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text id="Remember-Label" x="912" y="656" font-size="18" fill="#35415d">Remember me</text>
  </g>

  <!-- SIGN IN BUTTON -->
  <g id="Sign-In-Button" font-family="Inter, Arial, sans-serif">
    <rect id="Sign-In-Button-Background" x="875" y="686" width="522" height="56" rx="13" fill="url(#buttonGradient)"/>
    <text id="Sign-In-Button-Text" x="1124" y="722" text-anchor="middle" font-size="19" font-weight="600" fill="#ffffff">Sign In</text>
    <path id="Sign-In-Arrow" d="M1168 714 H1185 M1178 707 L1185 714 L1178 721" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
